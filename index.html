<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GC Submissions · Toby's Sports</title>
<meta name="description" content="Store portal for submitting redeemed gift certificates (TOBYS GC and Sodexo Pluxee) to Franchise Development.">
<meta name="theme-color" content="#0f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GC Submit">
<style>
:root{
  --navy:#0f2a4a; --navy-2:#173b66; --ink:#14202e; --muted:#5d6b7c; --line:#e1e6ec;
  --bg:#f3f5f8; --card:#ffffff; --accent:#d7262d; --accent-ink:#ffffff;
  --ok:#137a43; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fff2d9; --err:#b42318; --err-bg:#fdecea;
  --pluxee:#00a3a1; --pluxee-bg:#e0f5f4; --tobys:#d7262d; --tobys-bg:#fde8e8;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none;
  font-weight:800;font-size:15px;letter-spacing:.5px}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title span{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:rgba(255,255,255,.22)}
.net{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.off{background:#f5a524;color:#2a1a00}
.net.demo{background:#ffd23f;color:#2a1a00}

.banner{max-width:980px;margin:12px auto 0;padding:10px 14px;border-radius:10px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid #f3d9a6}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b))}

/* ---------- home ---------- */
.hero h1{font-size:22px;margin:6px 0 2px}
.hero p{margin:0 0 14px;color:var(--muted)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,59,102,.12)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.continue{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:12px 14px;margin-bottom:14px;width:100%;text-align:left;box-shadow:var(--shadow)}
.continue small{display:block;color:var(--muted);font-size:12px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.store-tab{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;box-shadow:var(--shadow);
  display:flex;gap:12px;align-items:center;transition:transform .08s,border-color .15s}
.store-tab:hover{border-color:var(--navy-2)}
.store-tab:active{transform:scale(.98)}
.store-ava{width:42px;height:42px;border-radius:11px;background:#e9eef5;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.store-tab b{display:block;font-size:14.5px;line-height:1.25}
.store-tab small{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

/* ---------- store view ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e6eaf0;border-radius:12px;padding:4px;margin-bottom:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:10}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--navy);color:#fff;font-size:11px;line-height:18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.step-n.done{background:var(--ok)}
.step-h h2{font-size:16px;margin:0;flex:1}
.step-h .meta{font-size:12px;color:var(--muted)}

.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;position:relative}
.type b{display:block;font-size:15px}
.type small{color:var(--muted);font-size:12px}
.type .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.type.on{border-color:var(--navy);background:#f3f7fc}
.type.on::after{content:"✓";position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:grid;place-items:center}

.series-entry{display:flex;gap:8px}
.series-entry input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
.series-entry input:focus,.field input:focus,.field textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,59,102,.12)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:650;background:var(--navy);color:#fff;white-space:nowrap}
.btn.ghost{background:#eef2f7;color:var(--navy)}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.accent{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;font-size:13px}
.helper{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.linkish{background:none;border:0;color:var(--navy-2);font-weight:600;padding:0;font-size:13px;text-decoration:underline}
.range{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fafbfd}
.range input{min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace}
.series-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc{display:inline-flex;align-items:center;gap:6px;background:#eef2f7;border-radius:8px;padding:5px 6px 5px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.sc button{border:0;background:transparent;width:22px;height:22px;border-radius:6px;color:var(--muted);font-size:16px;line-height:1}
.sc button:hover{background:#dfe5ee;color:var(--err)}
.series-tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

.drop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:2px dashed #c9d2de;border-radius:12px;padding:16px 10px;background:#fafbfd;text-align:center;color:var(--navy);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick small{color:var(--muted);font-weight:400;font-size:12px}
.pick:active{background:#eef2f7}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9eef5;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.thumb span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:10px;padding:10px 6px 4px}

.field{margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field label em{font-weight:400;color:var(--muted);font-style:normal}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}
.field textarea{min-height:64px;resize:vertical}

.submitbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--safe-b))}
.submitbar-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.submitbar .sum{flex:1;font-size:12.5px;color:var(--muted);line-height:1.3}
.submitbar .sum b{color:var(--ink);font-size:14px;display:block}
.submitbar .btn{padding:13px 20px}

/* ---------- submissions ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:11.5px}
.list-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.list-tools .search{flex:1;min-width:180px;margin:0}
.list-tools select{padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tix{display:flex;flex-direction:column;gap:8px}
.tk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;box-shadow:var(--shadow)}
.tk .id{font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.tk .when{font-size:12px;color:var(--muted)}
.tk .ser{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .row{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.pend{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:#e8eefb;color:#1d4ed8}
.pill.tobys{background:var(--tobys-bg);color:var(--tobys)}
.pill.pluxee{background:var(--pluxee-bg);color:#007d7b}
.pill.n{background:#eef2f7;color:var(--navy)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.mono-box{background:#f5f7fa;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;max-height:180px;overflow:auto;white-space:pre-wrap;margin-bottom:12px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sheet-actions .btn{flex:1}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:4px auto 12px;font-size:32px}
.big-warn{width:64px;height:64px;border-radius:50%;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;margin:4px auto 12px;font-size:30px}
.center{text-align:center}
.img-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.img-links a,.img-links div{aspect-ratio:1;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-size:12px;color:var(--navy);text-decoration:none;font-weight:600;overflow:hidden;border:1px solid var(--line)}
.img-links img{width:100%;height:100%;object-fit:cover}
.pin-input{width:100%;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#14202e;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.loading .spinner{border-color:#d5dce6;border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media(max-width:420px){.types,.drop{grid-template-columns:1fr 1fr}.stat b{font-size:17px}.kv{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="icon-btn hidden" id="backBtn" aria-label="Back to stores">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand-mark" id="brandMark">GC</div>
    <div class="top-title"><b id="topTitle">GC Submissions</b><span id="topSub">Redeemed gift certificates</span></div>
    <span class="net" id="netPill">Online</span>
    <button class="icon-btn hidden" id="installBtn" aria-label="Install app" title="Install app">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
  </div>
</header>
<div id="banner"></div>
<main id="app"><div class="loading"><span class="spinner"></span>Loading…</div></main>
<div id="submitbar"></div>
<div id="modalRoot"></div>
<input type="file" id="fileGallery" accept="image/*" multiple class="hidden">
<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
