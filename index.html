<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOBYS Franchise · GC Management Portal</title>
<meta name="description" content="Store portal for submitting redeemed gift certificates (TOBYS GC and Sodexo Pluxee) to Franchise Development.">
<meta name="theme-color" content="#0f2f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GC Portal">
<style>
:root{
  --blue-950:#081a3a; --blue-900:#0b2350; --blue-800:#0f2f66; --blue-700:#1546a0; --blue-600:#1d58c4; --blue-500:#2f6fd6; --blue-100:#e4ecfa; --blue-50:#f2f6fd;
  --silver-500:#9aa5b4; --silver-400:#b9c2ce; --silver-300:#d3d9e1; --silver-200:#e3e7ed; --silver-100:#eef1f5;
  --gray-900:#1b2533; --gray-700:#3d4857; --gray-600:#5b6676; --gray-500:#7a8594;
  --ink:var(--gray-900); --muted:var(--gray-600); --line:var(--silver-300);
  --bg:var(--silver-100); --card:#ffffff;
  --navy:var(--blue-800); --navy-2:var(--blue-700); --accent:var(--blue-600);
  --ok:#1546a0; --ok-bg:#e4ecfa; --warn:#8a5a00; --warn-bg:#fff3d6; --err:#b42318; --err-bg:#fdecea;
  --tobys:#1546a0; --tobys-bg:#e4ecfa; --pluxee:#4b5868; --pluxee-bg:#e6e9ee;
  --radius:12px; --shadow:0 1px 2px rgba(15,35,70,.06),0 6px 18px rgba(15,35,70,.07);
  --top-h:68px; --side-w:272px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--top-h) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 18px 0;background:linear-gradient(180deg,#fff 0%,#f4f6f9 100%);
  border-bottom:3px solid var(--blue-700);box-shadow:0 2px 12px rgba(10,30,70,.10);display:flex;align-items:center;gap:14px}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--silver-300);background:#fff;color:var(--blue-800);place-items:center;flex:none}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1;text-decoration:none}
.brand img{height:38px;width:auto;display:block;flex:none}
.brand-div{width:2px;height:36px;background:linear-gradient(180deg,transparent,var(--silver-400),transparent);flex:none}
.brand-name{min-width:0;line-height:1.1}
.brand-name b{display:block;font-size:17px;font-weight:800;letter-spacing:1.6px;color:var(--blue-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{display:block;font-size:12px;font-weight:700;letter-spacing:2.2px;color:var(--gray-600);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.net{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--blue-100);color:var(--blue-700);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.net.off{background:#fff3d6;color:#8a5a00}
.net.demo{background:var(--silver-200);color:var(--gray-700)}
.icon-btn{border:1px solid var(--silver-300);background:#fff;color:var(--blue-800);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--blue-50)}

/* ---------- sidebar ---------- */
.side{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:var(--side-w);z-index:35;
  background:linear-gradient(180deg,var(--blue-800) 0%,var(--blue-900) 55%,var(--blue-950) 100%);color:#fff;display:flex;flex-direction:column;
  box-shadow:2px 0 14px rgba(5,20,50,.25)}
.side-head{padding:16px 14px 10px}
.side-label{font-size:10.5px;font-weight:800;letter-spacing:2px;color:var(--silver-400);margin:0 4px 8px}
.side-search{position:relative}
.side-search input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;outline:none;font-size:13.5px}
.side-search input::placeholder{color:var(--silver-400)}
.side-search input:focus{border-color:var(--silver-400);background:rgba(255,255,255,.13)}
.side-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--silver-400)}
.side-home{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:4px 14px 6px;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:#dfe5ee;font-weight:600;text-align:left}
.side-home:hover{background:rgba(255,255,255,.07)}
.side-home.on{background:linear-gradient(90deg,#e9edf2,#c9d1dc);color:var(--blue-900)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 14px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.area{margin-top:10px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden}
.area-h{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border:0;background:transparent;color:#fff;text-align:left}
.area-h b{flex:1;min-width:0;font-size:11.5px;letter-spacing:1.1px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area-h .cnt{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:linear-gradient(90deg,#dfe4eb,#b9c2ce);color:var(--blue-900)}
.area-h .chev{transition:transform .15s;color:var(--silver-400)}
.area.closed .chev{transform:rotate(-90deg)}
.area.closed .area-list{display:none}
.area-list{padding:0 6px 6px}
.st{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#d8dfe9;text-align:left;font-size:13.5px}
.st:hover{background:rgba(255,255,255,.08);color:#fff}
.st .dot{width:7px;height:7px;border-radius:50%;background:var(--silver-500);flex:none}
.st .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st small{font-size:10.5px;color:var(--silver-500);font-weight:700;letter-spacing:.5px}
.st.on{background:linear-gradient(90deg,#f1f4f8,#cdd5df);color:var(--blue-900);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.st.on .dot{background:var(--blue-600)}
.st.on small{color:var(--blue-700)}
.side-foot{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:var(--silver-400);line-height:1.4}
.side-foot b{color:#e6ebf2;font-weight:600;word-break:break-all}
.side-empty{color:var(--silver-400);font-size:13px;padding:16px 6px}
.scrim-side{display:none}

/* ---------- main ---------- */
.main{margin-left:var(--side-w);padding-top:calc(var(--top-h) + env(safe-area-inset-top,0px));min-height:100vh}
#banner .banner{margin:16px 28px 0}
.banner{padding:10px 14px;border-radius:10px;font-size:13px;background:var(--silver-200);color:var(--gray-700);border:1px solid var(--silver-300)}
main{max-width:1060px;padding:18px 28px calc(110px + var(--safe-b))}
.page-h{display:flex;align-items:flex-end;gap:16px;margin:4px 0 16px;flex-wrap:wrap}
.page-h .ttl{flex:1;min-width:0}
.page-h h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.5px;color:var(--blue-900);text-transform:uppercase}
.page-h p{margin:3px 0 0;font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--gray-600);text-transform:uppercase}
.store-card{display:inline-flex;align-items:center;gap:12px;padding:12px 18px;border-radius:12px;background:#fff;border:2px solid var(--silver-300);box-shadow:var(--shadow)}

/* home */
.welcome{background:linear-gradient(135deg,var(--blue-800),var(--blue-600));color:#fff;border-radius:16px;padding:26px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.welcome h1{margin:0 0 6px;font-size:22px;letter-spacing:.4px}
.welcome p{margin:0;color:#dbe5f5;max-width:560px}
.welcome .btn{margin-top:16px;background:#fff;color:var(--blue-800)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.step3{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.step3 i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#eef1f5,#cfd6df);color:var(--blue-800);margin-bottom:8px}
.step3 b{display:block;font-size:14px;color:var(--blue-900)}
.step3 small{color:var(--muted);font-size:12.5px}
.continue{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue-600);border-radius:12px;padding:12px 16px;margin-top:14px;width:100%;text-align:left;box-shadow:var(--shadow)}
.continue small{display:block;color:var(--muted);font-size:12px}
.continue b{color:var(--blue-900)}
.store-ava{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#eef1f5,#c9d1dc);color:var(--blue-800);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

/* tabs */
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--silver-200);border:1px solid var(--silver-300);border-radius:12px;padding:4px;margin-bottom:16px;min-width:min(420px,100%)}
.seg button{white-space:nowrap;border:0;background:transparent;padding:10px 16px;border-radius:9px;font-weight:700;color:var(--gray-600)}
.seg button.on{background:linear-gradient(180deg,var(--blue-600),var(--blue-700));color:#fff;box-shadow:0 2px 6px rgba(21,70,160,.35)}
.seg .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--silver-300);color:var(--blue-900);font-size:11px;line-height:18px}
.seg button.on .count{background:rgba(255,255,255,.9)}

.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--silver-400);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.step-n{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#eef1f5,#c9d1dc);color:var(--blue-800);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.step-n.done{background:linear-gradient(135deg,var(--blue-500),var(--blue-700));color:#fff}
.step-h h2{font-size:15px;margin:0;flex:1;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue-900)}
.step-h .meta{font-size:12px;color:var(--muted);font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .card{margin-bottom:0}
.form-grid .span2{grid-column:1/-1}

.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;position:relative}
.type b{display:block;font-size:15px;color:var(--gray-900)}
.type small{color:var(--muted);font-size:12px}
.type .dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.type:hover{border-color:var(--silver-500)}
.type.on{border-color:var(--blue-600);background:var(--blue-50);box-shadow:0 0 0 3px rgba(29,88,196,.12)}
.type.on::after{content:"✓";position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--blue-600);color:#fff;font-size:12px;display:grid;place-items:center}

.series-entry{display:flex;gap:8px}
.series-entry input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px;background:#fbfcfd}
.series-entry input:focus,.field input:focus,.field textarea:focus,.range input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(47,111,214,.15);background:#fff}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:linear-gradient(180deg,var(--blue-600),var(--blue-700));color:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(21,70,160,.25)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:linear-gradient(180deg,#f4f6f9,#e3e7ed);color:var(--blue-800);box-shadow:none;border:1px solid var(--silver-300)}
.btn.danger{background:var(--err-bg);color:var(--err);box-shadow:none}
.btn.accent{background:linear-gradient(180deg,var(--blue-600),var(--blue-800))}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
.btn.sm{padding:8px 12px;font-size:13px}
.helper{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.linkish{background:none;border:0;color:var(--blue-600);font-weight:700;padding:0;font-size:13px;text-decoration:underline}
.range{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;padding:10px;border:1px dashed var(--silver-400);border-radius:10px;background:var(--silver-100)}
.range input{min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none}
.series-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc{display:inline-flex;align-items:center;gap:6px;background:var(--blue-50);border:1px solid #cfdcf3;color:var(--blue-900);border-radius:8px;padding:4px 5px 4px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.sc button{border:0;background:transparent;width:22px;height:22px;border-radius:6px;color:var(--gray-500);font-size:16px;line-height:1}
.sc button:hover{background:#dbe5f5;color:var(--err)}
.series-tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

.drop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:2px dashed var(--silver-400);border-radius:12px;padding:16px 10px;background:linear-gradient(180deg,#fafbfc,#f0f2f5);text-align:center;color:var(--blue-800);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick small{color:var(--muted);font-weight:500;font-size:12px}
.pick:hover{border-color:var(--blue-500);background:var(--blue-50)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--silver-200);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,25,55,.7);color:#fff;font-size:15px;line-height:1}
.thumb span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,25,55,.7));color:#fff;font-size:10px;padding:10px 6px 4px}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gray-700);margin-bottom:5px}
.field label em{font-weight:500;color:var(--muted);font-style:normal;text-transform:none;letter-spacing:0}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcfd}
.field textarea{min-height:64px;resize:vertical}

.submitbar{position:fixed;left:var(--side-w);right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--silver-300);
  padding:10px 28px calc(10px + var(--safe-b));box-shadow:0 -4px 16px rgba(10,30,70,.07)}
.submitbar-inner{max-width:1004px;display:flex;align-items:center;gap:12px}
.submitbar .sum{flex:1;font-size:12.5px;color:var(--muted);line-height:1.3}
.submitbar .sum b{color:var(--blue-900);font-size:14px;display:block}
.submitbar .btn{padding:13px 26px}

/* submissions */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue-600);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.stat:nth-child(2){border-top-color:var(--silver-500)}
.stat:nth-child(3){border-top-color:var(--gray-600)}
.stat:nth-child(4){border-top-color:var(--blue-800)}
.stat b{display:block;font-size:24px;color:var(--blue-900)}
.stat small{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.list-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search{position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(47,111,214,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.list-tools .search{flex:1;min-width:180px;margin:0}
.list-tools select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tix{display:flex;flex-direction:column;gap:8px}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--silver-400);border-radius:10px;padding:12px 16px;text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;box-shadow:var(--shadow)}
.tk:hover{border-left-color:var(--blue-600)}
.tk .id{font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;color:var(--blue-900)}
.tk .when{font-size:12px;color:var(--muted)}
.tk .ser{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .row{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.ok::before{content:"✓ "}
.pill.pend{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--silver-200);color:var(--gray-700)}
.pill.tobys{background:var(--tobys-bg);color:var(--tobys)}
.pill.pluxee{background:var(--pluxee-bg);color:var(--pluxee)}
.pill.n{background:var(--silver-200);color:var(--blue-900)}

/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(8,22,48,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + var(--safe-b));animation:up .2s ease-out;border-top:4px solid var(--blue-600)}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--blue-900)}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.mono-box{background:var(--silver-100);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;max-height:180px;overflow:auto;white-space:pre-wrap;margin-bottom:12px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sheet-actions .btn{flex:1}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;margin:4px auto 12px;font-size:32px}
.big-warn{width:64px;height:64px;border-radius:50%;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;margin:4px auto 12px;font-size:30px}
.center{text-align:center}
.img-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.img-links a,.img-links div{aspect-ratio:1;border-radius:10px;background:var(--silver-200);display:grid;place-items:center;font-size:12px;color:var(--blue-800);text-decoration:none;font-weight:700;overflow:hidden;border:1px solid var(--line)}
.img-links img{width:100%;height:100%;object-fit:cover}
.pin-input{width:100%;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:calc(50% + var(--side-w)/2);bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--blue-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:70;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.loading .spinner{border-color:var(--silver-300);border-top-color:var(--blue-700)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- responsive ---------- */
@media(max-width:900px){
  :root{--top-h:60px}
  .menu-btn{display:grid}
  .brand img{height:28px}
  .brand-div{height:28px}
  .brand-name b{font-size:13px;letter-spacing:1px}
  .brand-name span{font-size:10px;letter-spacing:1.2px}
  .side{transform:translateX(-102%);transition:transform .22s ease;width:min(300px,86vw)}
  body.side-open .side{transform:none}
  body.side-open .scrim-side{display:block;position:fixed;inset:0;top:calc(var(--top-h) + env(safe-area-inset-top,0px));background:rgba(8,22,48,.5);z-index:34}
  .main{margin-left:0}
  main{padding:14px 14px calc(110px + var(--safe-b))}
  #banner .banner{margin:12px 14px 0}
  .submitbar{left:0;padding:10px 14px calc(10px + var(--safe-b))}
  .toast{left:50%}
  .form-grid{grid-template-columns:1fr}
  .steps3{grid-template-columns:1fr}
  .page-h h1{font-size:20px}
  .seg{display:grid;width:100%}
}
@media(max-width:520px){
  .top{gap:10px;padding-left:12px;padding-right:12px}
  .brand-div{display:none}
  .brand{gap:8px}
  .brand img{height:22px}
  .brand-name b{font-size:11.5px;letter-spacing:.6px}
  .brand-name span{font-size:9px;letter-spacing:.8px;margin-top:2px}
  .net{font-size:0;padding:6px;gap:0}
  .net::before{width:9px;height:9px}
  .stat b{font-size:19px}
  .kv{grid-template-columns:96px 1fr}
  .stats{gap:8px}
  .stat{padding:10px}
}
@media(max-width:360px){ .brand img{display:none} }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Open store list">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="Home">
    <img src="icons/tobys-logo.png" alt="Toby's Sports">
    <span class="brand-div"></span>
    <span class="brand-name"><b>TOBYS FRANCHISE</b><span>GC MANAGEMENT PORTAL</span></span>
  </a>
  <div class="top-right">
    <span class="net" id="netPill">Online</span>
    <button class="icon-btn hidden" id="installBtn" aria-label="Install app" title="Install app">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
  </div>
</header>
<aside class="side" id="side" aria-label="Stores"></aside>
<div class="scrim-side" id="sideScrim"></div>
<div class="main">
  <div id="banner"></div>
  <main id="app"><div class="loading"><span class="spinner"></span>Loading…</div></main>
</div>
<div id="submitbar"></div>
<div id="modalRoot"></div>
<input type="file" id="fileGallery" accept="image/*" multiple class="hidden">
<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
